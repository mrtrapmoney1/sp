<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServiceDispatch Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #2c5282;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .logo p {
            color: #718096;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3748;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3182ce;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #2c5282;
        }

        .btn-login:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        .status.success {
            background: #c6f6d5;
            color: #276749;
            display: block;
        }

        .status.error {
            background: #fed7d7;
            color: #c53030;
            display: block;
        }

        .status.loading {
            background: #e9d8fd;
            color: #6b46c1;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #718096;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ServiceDispatch Portal</h1>
            <p>Metro TV & Appliance</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="user_id">User ID</label>
                <input type="text" id="user_id" maxlength="10" value="MET11106" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="servicer_account">Servicer Account</label>
                <input type="text" id="servicer_account" maxlength="10" value="MET11106">
            </div>

            <div class="form-group">
                <label for="environment">Environment</label>
                <select id="environment">
                    <option value="production_na">Production - North America</option>
                    <option value="production_eu">Production - Europe</option>
                    <option value="staging_na">Staging - North America</option>
                    <option value="staging_eu">Staging - Europe</option>
                </select>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div id="status" class="status"></div>

        <div class="footer">
            <p>&copy; 2026 Metro TV & Appliance. All rights reserved.</p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('status');

            const user_id = document.getElementById('user_id').value.trim();
            const password = document.getElementById('password').value.trim();
            const servicer_account = document.getElementById('servicer_account').value.trim();
            const environment = document.getElementById('environment').value;

            btn.disabled = true;
            status.textContent = 'Authenticating with ServicePower...';
            status.className = 'status loading';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, password, servicer_account, environment })
                });

                const data = await response.json();

                if (data.success) {
                    status.textContent = 'Login successful! Redirecting...';
                    status.className = 'status success';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    status.textContent = 'Login failed: ' + (data.error || 'Invalid credentials');
                    status.className = 'status error';
                    btn.disabled = false;
                }
            } catch (err) {
                status.textContent = 'Connection error: ' + err.message;
                status.className = 'status error';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
