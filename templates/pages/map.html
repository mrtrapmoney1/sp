<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map View - ServiceDispatch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        .header {
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .nav {
            display: flex;
            gap: 5px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
            font-weight: 500;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav a.active {
            background: rgba(255,255,255,0.2);
        }

        .map-container {
            flex: 1;
            display: flex;
            position: relative;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .sidebar {
            width: 350px;
            background: #161b22;
            border-left: 1px solid #30363d;
            overflow-y: auto;
            padding: 20px;
        }

        .panel {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .panel h2 {
            font-size: 1rem;
            color: #58a6ff;
            margin-bottom: 10px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #8b949e;
            font-size: 0.85rem;
            display: block;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 0.9rem;
            background: #0d1117;
            color: #c9d1d9;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-primary {
            background: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }

        .status {
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .status.success {
            background: #238636;
            color: white;
            display: block;
        }

        .status.error {
            background: #da3633;
            color: white;
            display: block;
        }

        .status.loading {
            background: #1f6feb;
            color: white;
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: #0d1117;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 4px;
        }

        .filter-group {
            margin-bottom: 12px;
        }

        .filter-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 0.85rem;
            background: #0d1117;
            color: #c9d1d9;
        }

        /* Leaflet popup customization */
        .leaflet-popup-content-wrapper {
            background: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .leaflet-popup-content {
            margin: 10px;
            font-size: 0.85rem;
        }

        .popup-field {
            margin-bottom: 5px;
        }

        .popup-label {
            color: #58a6ff;
            font-weight: 600;
        }

        .popup-value {
            color: #c9d1d9;
        }

        .leaflet-popup-tip {
            background: #161b22;
            border: 1px solid #30363d;
        }

        /* Legend */
        .map-legend {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .legend-title {
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>ServiceDispatch Map View</h1>
            <nav class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/tickets">Tickets</a>
                <a href="/map" class="active">Map</a>
                <a href="/analytics">Analytics</a>
                <a href="#" onclick="logout(); return false;" style="color: #fc8181;">Logout</a>
            </nav>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
        <div class="sidebar">
            <div class="panel">
                <h2>Fetch Settings</h2>
                <div class="form-group">
                    <label for="days">Date Range</label>
                    <select id="days">
                        <option value="1">Last 1 day</option>
                        <option value="2" selected>Last 2 days</option>
                        <option value="5">Last 5 days</option>
                        <option value="7">Last 7 days</option>
                        <option value="14">Last 14 days</option>
                        <option value="30">Last 30 days</option>
                        <option value="60">Last 60 days</option>
                        <option value="90">Last 90 days</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="fetchBtn" onclick="fetchCalls()">Load Map</button>
                <div id="status" class="status"></div>
            </div>

            <div class="panel">
                <h2>Statistics</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="totalCalls">0</div>
                        <div class="stat-label">Total Calls</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="mappedCalls">0</div>
                        <div class="stat-label">Mapped</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Legend</h2>
                <div class="map-legend" id="legendContainer">
                    <div class="legend-title">Product Types</div>
                    <div id="legendItems"></div>
                </div>
            </div>

            <div class="panel">
                <h2>Filters</h2>
                <div class="filter-group">
                    <select id="warrantyFilter" onchange="filterMarkers()">
                        <option value="">All Warranty Companies</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="brandFilter" onchange="filterMarkers()">
                        <option value="">All Brands</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="productFilter" onchange="filterMarkers()">
                        <option value="">All Products</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];
        let allCalls = [];

        // Product type colors
        const PRODUCT_COLORS = {
            'WASHER': '#1f6feb',
            'DRYER': '#f0883e',
            'DISHWASHER': '#238636',
            'REFRIGERATOR': '#da3633',
            'RANGE': '#8b949e',
            'OVEN': '#a371f7',
            'MICROWAVE': '#d2a8ff',
            'COOKTOP': '#56d364',
            'DEFAULT': '#6e7681'
        };

        // Warranty company mapping
        const WARRANTY_MAP = {
            '6RW97': 'GE Warranty',
            '10826': 'Electrolux',
            'MET11106': 'SquareTrade',
            'METTVAU': 'Assurant'
        };

        // Initialize map centered on Nebraska
        function initMap() {
            map = L.map('map').setView([41.2565, -95.9345], 8);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Load saved credentials
        function loadCredentials() {
            const saved = sessionStorage.getItem('sp_credentials');
            if (saved) {
                const creds = JSON.parse(saved);
                if (creds.password) document.getElementById('password').value = creds.password;
                if (creds.environment) document.getElementById('environment').value = creds.environment;
            }
        }

        // Save credentials
        function saveCredentials() {
            const creds = {
                password: document.getElementById('password').value,
                environment: document.getElementById('environment').value
            };
            sessionStorage.setItem('sp_credentials', JSON.stringify(creds));
        }

        function getWarrantyCompany(call) {
            const serviceCenter = call.ServiceCenter || '';
            return WARRANTY_MAP[serviceCenter] || 'Unknown';
        }

        function getProductColor(productType) {
            const product = (productType || '').toUpperCase();
            for (const [key, color] of Object.entries(PRODUCT_COLORS)) {
                if (product.includes(key)) {
                    return color;
                }
            }
            return PRODUCT_COLORS.DEFAULT;
        }

        function buildLegend() {
            const productTypes = new Set();
            allCalls.forEach(call => {
                const product = call.ProductInfo_SPProductDesc || 'Unknown';
                productTypes.add(product);
            });

            const legendItems = document.getElementById('legendItems');
            legendItems.innerHTML = '';

            Array.from(productTypes).sort().forEach(product => {
                const color = getProductColor(product);
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-color" style="background: ${color};"></div><span>${product}</span>`;
                legendItems.appendChild(item);
            });
        }

        // Logout
        async function logout() {
            if (!confirm('Are you sure you want to logout?')) return;

            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (err) {
                console.error('Logout error:', err);
                window.location.href = '/';
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initMap();
            loadCredentials();
        });

        async function fetchCalls() {
            const btn = document.getElementById('fetchBtn');
            const status = document.getElementById('status');
            const days = document.getElementById('days').value;

            btn.disabled = true;
            status.textContent = 'Fetching calls...';
            status.className = 'status loading';

            try {
                const response = await fetch('/api/calls', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: parseInt(days) })
                });

                const data = await response.json();

                if (data.success) {
                    status.textContent = `${data.count} calls loaded`;
                    status.className = 'status success';
                    allCalls = data.calls;
                    buildLegend();
                    await geocodeAndDisplayCalls();
                    buildFilters();
                } else {
                    status.textContent = data.error || 'Error fetching data';
                    status.className = 'status error';
                }
            } catch (err) {
                status.textContent = 'Connection error: ' + err.message;
                status.className = 'status error';
            }

            btn.disabled = false;
        }

        async function geocodeAndDisplayCalls() {
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            let mappedCount = 0;

            for (const call of allCalls) {
                const address = call.ConsumerInfo_ConsumerAddress1 || '';
                const city = call.ConsumerInfo_PostcodeLevel3 || '';
                const state = call.ConsumerInfo_PostcodeLevel1 || '';
                const zip = call.ConsumerInfo_Postcode || '';

                if (!city || !state) continue;

                try {
                    // Use Nominatim for geocoding (free, but rate-limited)
                    const query = `${address}, ${city}, ${state} ${zip}`.replace(/\s+/g, '+');
                    const geoResponse = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`);

                    // Respect rate limit
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const geoData = await geoResponse.json();

                    if (geoData && geoData.length > 0) {
                        const lat = parseFloat(geoData[0].lat);
                        const lon = parseFloat(geoData[0].lon);

                        const markerColor = getProductColor(call.ProductInfo_SPProductDesc);
                        const marker = L.circleMarker([lat, lon], {
                            radius: 8,
                            fillColor: markerColor,
                            color: '#fff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        const popupContent = `
                            <div class="popup-field"><span class="popup-label">Name:</span> <span class="popup-value">${call.ConsumerInfo_ConsumerFirstName} ${call.ConsumerInfo_ConsumerLastName}</span></div>
                            <div class="popup-field"><span class="popup-label">Address:</span> <span class="popup-value">${address}</span></div>
                            <div class="popup-field"><span class="popup-label">City:</span> <span class="popup-value">${city}, ${state}</span></div>
                            <div class="popup-field"><span class="popup-label">Phone:</span> <span class="popup-value">${call.ConsumerInfo_Phone1}</span></div>
                            <div class="popup-field"><span class="popup-label">Product:</span> <span class="popup-value">${call.ProductInfo_SPBrandDesc} ${call.ProductInfo_SPProductDesc}</span></div>
                            <div class="popup-field"><span class="popup-label">Model:</span> <span class="popup-value">${call.ProductInfo_MobelNo || 'N/A'}</span></div>
                            <div class="popup-field"><span class="popup-label">Problem:</span> <span class="popup-value">${call.ProbelmDesc || 'N/A'}</span></div>
                            <div class="popup-field"><span class="popup-label">Call #:</span> <span class="popup-value">${call.CallNumber}</span></div>
                        `;

                        marker.bindPopup(popupContent);
                        marker.callData = call;
                        markers.push(marker);
                        mappedCount++;
                    }
                } catch (err) {
                    console.error('Geocoding error:', err);
                }
            }

            document.getElementById('totalCalls').textContent = allCalls.length;
            document.getElementById('mappedCalls').textContent = mappedCount;

            // Fit map to markers
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function buildFilters() {
            const warranties = new Set();
            const brands = new Set();
            const products = new Set();

            allCalls.forEach(call => {
                warranties.add(getWarrantyCompany(call));
                if (call.ProductInfo_SPBrandDesc) brands.add(call.ProductInfo_SPBrandDesc);
                if (call.ProductInfo_SPProductDesc) products.add(call.ProductInfo_SPProductDesc);
            });

            populateFilter('warrantyFilter', Array.from(warranties).sort());
            populateFilter('brandFilter', Array.from(brands).sort());
            populateFilter('productFilter', Array.from(products).sort());
        }

        function populateFilter(filterId, options) {
            const select = document.getElementById(filterId);
            const filterName = filterId.replace('Filter', '');
            const displayName = filterName === 'warranty' ? 'Warranty Companies' :
                              filterName === 'brand' ? 'Brands' :
                              filterName === 'product' ? 'Products' : 'Items';
            select.innerHTML = `<option value="">All ${displayName}</option>`;
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                select.appendChild(option);
            });
        }

        function filterMarkers() {
            const warranty = document.getElementById('warrantyFilter').value;
            const brand = document.getElementById('brandFilter').value;
            const product = document.getElementById('productFilter').value;

            let visibleCount = 0;

            markers.forEach(marker => {
                const call = marker.callData;
                let visible = true;

                if (warranty && getWarrantyCompany(call) !== warranty) visible = false;
                if (brand && call.ProductInfo_SPBrandDesc !== brand) visible = false;
                if (product && call.ProductInfo_SPProductDesc !== product) visible = false;

                if (visible) {
                    marker.addTo(map);
                    visibleCount++;
                } else {
                    map.removeLayer(marker);
                }
            });

            document.getElementById('mappedCalls').textContent = visibleCount;
        }
    </script>
</body>
</html>
