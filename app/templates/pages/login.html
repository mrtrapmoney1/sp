<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServiceDispatch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #4a5568 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.75rem;
            color: #1a365d;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #2c5282;
            box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232d3748' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 44px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-danger {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #48bb78;
        }

        .hidden {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #718096;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ServiceDispatch</h1>
            <p>Metro TV & Appliance Service Management</p>
        </div>

        <div id="error-alert" class="alert alert-danger hidden"></div>
        <div id="success-alert" class="alert alert-success hidden"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="user_id">User ID</label>
                <input type="text" id="user_id" name="user_id" class="form-control"
                       placeholder="Enter your ServicePower User ID" required maxlength="10"
                       value="MET11106">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required maxlength="10">
            </div>

            <div class="form-group">
                <label class="form-label" for="servicer_account">Servicer Account</label>
                <input type="text" id="servicer_account" name="servicer_account" class="form-control"
                       placeholder="Enter servicer account number" maxlength="10"
                       value="MET11106">
            </div>

            <div class="form-group">
                <label class="form-label" for="environment">Environment</label>
                <select id="environment" name="environment" class="form-control">
                    {% for key, url in environments.items() %}
                    <option value="{{ key }}" {% if key == 'production_na' %}selected{% endif %}>
                        {{ key.replace('_', ' ').title() }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" id="login-btn" class="btn-login">
                <span id="btn-text">Sign In</span>
                <span id="btn-loading" class="hidden">
                    <span class="loading-spinner"></span>
                    Connecting...
                </span>
            </button>
        </form>

        <p class="footer-text">
            ServiceDispatch API Integration
        </p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const form = document.getElementById('login-form');
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');

            // Hide alerts
            errorAlert.classList.add('hidden');
            successAlert.classList.add('hidden');

            // Show loading state
            btn.disabled = true;
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: document.getElementById('user_id').value,
                        password: document.getElementById('password').value,
                        servicer_account: document.getElementById('servicer_account').value,
                        environment: document.getElementById('environment').value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    successAlert.textContent = result.message || 'Login successful!';
                    successAlert.classList.remove('hidden');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    errorAlert.textContent = result.error || 'Login failed. Please check your credentials.';
                    errorAlert.classList.remove('hidden');

                    // Reset button
                    btn.disabled = false;
                    btnText.classList.remove('hidden');
                    btnLoading.classList.add('hidden');
                }
            } catch (err) {
                console.error('Login error:', err);
                errorAlert.textContent = 'Connection error. Please try again.';
                errorAlert.classList.remove('hidden');

                // Reset button
                btn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
