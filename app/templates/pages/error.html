<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - ServiceDispatch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .error-message {
            color: #718096;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #1a365d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2c5282;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ error.code if error.code else '500' }}</div>
        <h1 class="error-title">{{ error.name if error.name else 'Something went wrong' }}</h1>
        <p class="error-message">
            {{ error.description if error.description else 'An unexpected error occurred. Please try again.' }}
        </p>
        <a href="/dashboard" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
